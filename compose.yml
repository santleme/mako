services:
  agent:
    build: .
    env_file: ${PLOW_CREDENTIALS:-./plow-credentials}
    environment:
      AGENT_ID: mako
      # Mako is SMS-first. Keep a broken/unavailable Mac relay out of the
      # critical path; set MAKO_SMS_ONLY=false when Latch is needed again.
      MAKO_SMS_ONLY: "true"
    volumes:
      - mako-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  mako-home:
